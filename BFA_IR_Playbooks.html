<html lang="en">
<head>
<meta charset="UTF-8">

<title>BFA Financial Advisory — Cybersecurity IR Playbooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #1F1F1F; }

  .top-bar { background: #1F3864; color: white; padding: 18px 32px; }
  .top-bar h1 { font-size: 20px; font-weight: 700; }
  .top-bar p  { font-size: 13px; opacity: .75; margin-top: 4px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* Attack selector */
  .attack-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .atk { padding: 7px 16px; border-radius: 20px; border: 1.5px solid #c8cfd8;
         background: white; font-size: 13px; cursor: pointer; font-weight: 500;
         color: #44546A; transition: all .15s; }
  .atk:hover { border-color: #2E75B6; color: #2E75B6; }
  .atk.active { background: #EEEDFE; border-color: #534AB7; color: #3C3489; }

  /* Severity + IOC row */
  .meta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
  .sev-badge { padding: 5px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .sev-critical { background: #FDECEA; color: #C00000; border: 1px solid #F09595; }
  .sev-high     { background: #FFF3E0; color: #C55A11; border: 1px solid #FAC775; }

  .esc-box { background: #FFF3E0; border: 1px solid #FAC775; border-radius: 8px;
             padding: 10px 14px; font-size: 12px; color: #633806; flex: 1; min-width: 260px; }
  .esc-box strong { display: block; margin-bottom: 3px; }

  .ioc-box { background: white; border: 1px solid #e0e4ea; border-radius: 8px;
             padding: 10px 14px; margin-bottom: 16px; }
  .ioc-box p { font-size: 11px; font-weight: 700; color: #44546A; margin-bottom: 6px;
               text-transform: uppercase; letter-spacing: .05em; }
  .ioc-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .ioc-tag { font-size: 11px; padding: 2px 8px; background: #f4f6f9;
             border: 1px solid #c8cfd8; border-radius: 4px; font-family: monospace; color: #44546A; }

  /* Phase tabs */
  .phase-tabs { display: flex; gap: 2px; border-bottom: 2px solid #e0e4ea;
                margin-bottom: 18px; overflow-x: auto; }
  .ph { padding: 8px 14px; border: none; background: transparent; font-size: 12px;
        font-weight: 600; cursor: pointer; color: #888; border-bottom: 3px solid transparent;
        margin-bottom: -2px; white-space: nowrap; transition: all .15s; }
  .ph:hover { color: #2E75B6; }
  .ph.active { color: #2E75B6; border-bottom-color: #2E75B6; }

  .phase-time { font-size: 11px; color: #888; margin-bottom: 14px; }

  /* 3 column grid */
  .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media(max-width:700px) { .cols { grid-template-columns: 1fr; } }

  .col-card { background: white; border: 1px solid #e0e4ea; border-radius: 10px;
              padding: 14px; border-top: 4px solid #888; }
  .col-card.gen { border-top-color: #44546A; }
  .col-card.edlp { border-top-color: #1D6A96; }
  .col-card.edr  { border-top-color: #2F5597; }

  .col-hdr { font-size: 11px; font-weight: 700; text-transform: uppercase;
             letter-spacing: .05em; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .col-card.gen  .col-hdr { color: #44546A; }
  .col-card.edlp .col-hdr { color: #1D6A96; }
  .col-card.edr  .col-hdr { color: #2F5597; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-gen  { background: #44546A; }
  .dot-edlp { background: #1D6A96; }
  .dot-edr  { background: #2F5597; }

  ul.actions { list-style: none; padding: 0; }
  ul.actions li { font-size: 12.5px; line-height: 1.55; padding: 5px 0;
                  border-bottom: 1px solid #f0f0f0; color: #1F1F1F; }
  ul.actions li:last-child { border-bottom: none; }
  ul.actions li::before { content: "→ "; color: #aaa; font-weight: 600; }

  /* Legend */
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; }
</style>
</head>

      { name:"Recover", time:"2–12 hrs",
        gen:["Restore IIS web server service after attack traffic subsides","Validate full service health, response times, and availability for BFA's client portal","Disable temporary geo-blocks and rate limits once the attack risk has passed"],
        edlp:["Restore standard EDLP monitoring policies across all endpoints","Confirm EDLP console is back to standard monitoring and no emergency policies remain active"],
        edr:["Unisolate any cleaned endpoints that were isolated during containment","Validate EDR sensor health and connectivity on all affected systems","Review and normalise all emergency firewall rules applied during the incident"] },
      { name:"Lessons Learned", time:"24–72 hrs",
        gen:["Review DDoS mitigation playbook effectiveness — update ISP and WAF contact runbooks","Assess whether BFA's bandwidth and scrubbing capacity is adequate for future attacks","Document all source IPs, attack vectors, and response actions for future reference"],
        edlp:["Document whether DDoS was used as a distraction — update DLP correlation rules if so","Add simultaneous DDoS and data exfiltration scenario to the BFA threat model"],
        edr:["Update Defender detection rules for botnet activity based on TTPs observed","Review ASR rules and network protection settings in Defender for improvement opportunities","Include DDoS scenario in next BFA tabletop exercise to test response readiness"] }
    ]
  }
];

let selAttack = 0, selPhase = 0;

function renderAttacks() {
  document.getElementById("attackRow").innerHTML = DATA.map((a,i) =>
    `<button class="atk${i===selAttack?' active':''}" onclick="selectAttack(${i})">${a.label}</button>`
  ).join("");
}

function renderMeta() {
  const a = DATA[selAttack];
  const sc = a.severity==="critical" ? "sev-critical" : "sev-high";
  const dot = a.severity==="critical" ? "🔴" : "🟠";
  document.getElementById("metaRow").innerHTML = `
    <span class="sev-badge ${sc}">${dot} ${a.severity.toUpperCase()}</span>
    <div class="esc-box"><strong>⚡ Escalation trigger:</strong>${a.escalate}</div>`;
  document.getElementById("iocBox").innerHTML = `
    <p>Key Indicators of Compromise</p>
    <div class="ioc-tags">${a.iocs.map(i=>`<span class="ioc-tag">${i}</span>`).join("")}</div>`;
}

function renderPhases() {
  const a = DATA[selAttack];
  const colors = ["#534AB7","#185FA5","#A32D2D","#854F0B","#0F6E56","#3B6D11"];
  document.getElementById("phaseTabs").innerHTML = a.phases.map((p,i) =>
    `<button class="ph${i===selPhase?' active':''}"
      style="${i===selPhase?`color:${colors[i]};border-bottom-color:${colors[i]}`:''}"
      onclick="selectPhase(${i})">Phase ${i+1}: ${p.name}</button>`
  ).join("");
}

function renderContent() {
  const p = DATA[selAttack].phases[selPhase];
  document.getElementById("phaseTime").innerHTML = `⏱ Target response time: <strong>${p.time}</strong>`;
  const mkList = items => items.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("colsContent").innerHTML = `
    <div class="col-card gen">
      <div class="col-hdr"><span class="dot dot-gen"></span>General IR Actions</div>
      <ul class="actions">${mkList(p.gen)}</ul>
    </div>
    <div class="col-card edlp">
      <div class="col-hdr"><span class="dot dot-edlp"></span>Symantec EDLP Actions</div>
      <ul class="actions">${mkList(p.edlp)}</ul>
    </div>
    <div class="col-card edr">
      <div class="col-hdr"><span class="dot dot-edr"></span>Microsoft Defender EDR Actions</div>
      <ul class="actions">${mkList(p.edr)}</ul>
    </div>`;
}

function selectAttack(i) { selAttack=i; selPhase=0; render(); }
function selectPhase(i)  { selPhase=i; renderPhases(); renderContent(); }
function render() { renderAttacks(); renderMeta(); renderPhases(); renderContent(); }
render();
</script>
</body>
</html>
